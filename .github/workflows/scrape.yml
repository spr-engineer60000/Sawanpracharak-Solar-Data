name: Scrape iSolarCloud dashboard

on:
  schedule:
    # Runs every 15 minutes, aligned to real clock quarters starting at
    # minute 0 (:00 / :15 / :30 / :45, UTC -- per explicit request). Note
    # GitHub itself warns load is worst exactly at these marks because
    # every repo's identically-scheduled workflow fires at once, so
    # `schedule:` runs here can still lag behind the exact minute -- that's
    # a GitHub-side best-effort limitation, not something this file
    # controls. See Code.gs's triggerGitHubScrape_() / SETUP.md for a
    # second, more dependable driver of this same workflow that runs from
    # Google Apps Script's own scheduler instead of GitHub's.
    #
    # Spelled out as an explicit comma list (rather than the equivalent
    # "*/15 * * * *" step form) purely to rule out any doubt about how
    # GitHub's cron parser handles step syntax -- both are valid POSIX
    # cron, but this form can't be misread.
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/package.json') }}

      - name: Install Chromium for Playwright
        working-directory: scraper
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium OS deps only (cache hit)
        working-directory: scraper
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run scraper
        working-directory: scraper
        env:
          ISOLAR_URL: ${{ secrets.ISOLAR_URL }}
          ISOLAR_USERNAME: ${{ secrets.ISOLAR_USERNAME }}
          ISOLAR_PASSWORD: ${{ secrets.ISOLAR_PASSWORD }}
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: npm run scrape

      # Uploaded every run now (not just on failure) -- scraper.js always
      # writes these two files, even when the run succeeds, specifically so
      # a misparsed-but-not-"missing" field (like a wrong unit or a swapped
      # value) can be diagnosed from the actual page text instead of guessing
      # blind. Overwrites the same artifact name each run, 3-day retention,
      # so this doesn't pile up storage over time -- download it any time
      # from this workflow's most recent run under Actions > (run) > Artifacts.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            scraper/debug-screenshot.png
            scraper/debug-innertext.txt
          if-no-files-found: ignore
          retention-days: 3
