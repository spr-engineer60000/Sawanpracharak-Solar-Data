name: Scrape iSolarCloud dashboard

on:
  schedule:
    # Runs every 15 minutes (was every 5), at minutes 3/18/33/48. GitHub's
    # scheduler is best-effort and can drift under load -- and GitHub
    # explicitly warns that load is worst right at the top of every interval
    # (:00, :15, :30, ...) because that's when every repo's identically-
    # scheduled workflow fires at once. Offsetting to minute 3 avoids that
    # stampede and runs noticeably closer to on-time in practice.
    #
    # Spelled out as an explicit comma list (rather than the equivalent
    # "3-59/15 * * * *" step-range form) purely to rule out any doubt about
    # how GitHub's cron parser handles combined range+step syntax -- both
    # are valid POSIX cron, but this form can't be misread.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/package.json') }}

      - name: Install Chromium for Playwright
        working-directory: scraper
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Chromium OS deps only (cache hit)
        working-directory: scraper
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run scraper
        working-directory: scraper
        env:
          ISOLAR_URL: ${{ secrets.ISOLAR_URL }}
          ISOLAR_USERNAME: ${{ secrets.ISOLAR_USERNAME }}
          ISOLAR_PASSWORD: ${{ secrets.ISOLAR_PASSWORD }}
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: npm run scrape

      # Uploaded every run now (not just on failure) -- scraper.js always
      # writes these two files, even when the run succeeds, specifically so
      # a misparsed-but-not-"missing" field (like a wrong unit or a swapped
      # value) can be diagnosed from the actual page text instead of guessing
      # blind. Overwrites the same artifact name each run, 3-day retention,
      # so this doesn't pile up storage over time -- download it any time
      # from this workflow's most recent run under Actions > (run) > Artifacts.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            scraper/debug-screenshot.png
            scraper/debug-innertext.txt
          if-no-files-found: ignore
          retention-days: 3
